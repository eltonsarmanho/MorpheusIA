# nginx do host — site estático Morpheus IA + proxy para o backend FastAPI.
#
# Instalado na VM em /etc/nginx/sites-available/morpheusia com link simbólico
# em sites-enabled/. O certbot acrescenta a seção 443 e o redirecionamento
# automaticamente ao emitir o certificado (`certbot --nginx`).

server {
    listen 80;
    listen [::]:80;
    server_name srv1633081.hstgr.cloud;

    root /opt/morpheusia;
    index index.html;

    access_log /var/log/nginx/morpheusia.access.log;
    error_log  /var/log/nginx/morpheusia.error.log;

    # Cabeçalhos de segurança básicos.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 1m;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 512;

    # API do chatbot: mesmo domínio do site, então o widget não precisa de CORS.
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # O backend chama a MariTalk de forma síncrona; o timeout precisa
        # acomodar a latência do modelo sem derrubar a requisição.
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    location = /health {
        proxy_pass http://127.0.0.1:8000/health;
        access_log off;
    }

    # Site estático.
    location / {
        try_files $uri $uri/ =404;
    }

    location ~* \.(css|js|svg|png|jpg|jpeg|webp|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    # Nada fora da raiz do site deve ser servido.
    location ~ /\. {
        deny all;
    }
}
