# Compose de produção (VM Hostinger srv1633081).
#
# Diferenças em relação ao docker-compose.yml de desenvolvimento:
#   - a porta 8000 é publicada APENAS em 127.0.0.1, nunca na internet. Quem
#     expõe a aplicação é o nginx do host, que termina o TLS e faz proxy para cá.
#   - limites de memória, porque a VM tem 1 vCPU / 3.8 GiB e nenhuma folga para
#     um contêiner sem teto.
services:
  backend:
    build:
      context: ./backend
    image: morpheusia-backend:latest
    container_name: morpheusia-backend
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    volumes:
      - ./backend/data:/app/data
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 768M
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/health').read()\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
